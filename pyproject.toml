[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypdpg"
version = "0.1.0"
description = "Encrypted execution for common Python data workloads: numpy core with pandas and scikit-learn layers. Current backend: TenSEAL (CKKS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "PDPG-lab" }]
dependencies = ["numpy", "tenseal"]

[project.scripts]
pdpg = "pypdpg.cli:main"

[project.urls]
Homepage = "https://pdpglab.xyz"
Repository = "https://github.com/PDPG-lab/pypdpg"

[tool.hatch.build.targets.wheel]
packages = ["src/pypdpg"]
